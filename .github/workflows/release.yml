name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare or create release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  publish:
    name: Publish npm package
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: >-
          node --input-type=module -e
          'import pkg from "./package.json" with { type: "json" };
          import { PACKAGE_VERSION } from "./dist/package.js";
          if (pkg.version !== process.env.RELEASE_VERSION || PACKAGE_VERSION !== pkg.version) {
            throw new Error(`release ${process.env.RELEASE_VERSION}, package.json ${pkg.version}, MCP ${PACKAGE_VERSION} must match`);
          }'

      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          npm pack --json --ignore-scripts > npm-pack.json
          package_file="$(jq -r '.[0].filename' npm-pack.json)"
          test -f "$package_file"
          sha256sum "$package_file" > "$package_file.sha256"
          echo "file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Publish exact artifact to npm
        run: npm publish "${{ steps.pack.outputs.file }}" --access public

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" --clobber
