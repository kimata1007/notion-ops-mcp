name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare or create release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4

  publish:
    name: Publish npm package
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      package_name: ${{ steps.metadata.outputs.name }}
      package_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify release version
        id: metadata
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: >-
          node --input-type=module -e
          'import pkg from "./package.json" with { type: "json" };
          import { PACKAGE_VERSION } from "./dist/package.js";
          if (pkg.version !== process.env.RELEASE_VERSION || PACKAGE_VERSION !== pkg.version) {
            throw new Error(`release ${process.env.RELEASE_VERSION}, package.json ${pkg.version}, MCP ${PACKAGE_VERSION} must match`);
          }
          process.stdout.write(`name=${pkg.name}\n`);' >> "$GITHUB_OUTPUT"

      - name: Pack release artifact
        id: pack
        shell: bash
        run: |
          npm pack --json --ignore-scripts > npm-pack.json
          package_file="$(jq -r '.[0].filename' npm-pack.json)"
          test -f "$package_file"
          sha256sum "$package_file" > "$package_file.sha256"
          echo "file=$package_file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 < "$package_file.sha256")" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the isolated package artifact
        run: npm run smoke:package -- "${{ steps.pack.outputs.file }}"

      - name: Publish exact artifact to npm
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          local_integrity="$(node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);
          ' "$PACKAGE_FILE")"
          published_integrity="$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)"
          if [[ -n "$published_integrity" ]]; then
            test "$published_integrity" = "$local_integrity"
            echo "$PACKAGE_NAME@$RELEASE_VERSION is already published with the same integrity"
          else
            npm publish "$PACKAGE_FILE" --access public
          fi

  attach:
    name: Attach published package to GitHub Release
    needs: [release, publish]
    if: ${{ needs.release.outputs.release_created == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download and verify the published package
        id: download
        env:
          EXPECTED_SHA256: ${{ needs.publish.outputs.package_sha256 }}
          PACKAGE_NAME: ${{ needs.publish.outputs.package_name }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          tarball_url="$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" dist.tarball)"
          package_file="${tarball_url##*/}"
          curl --fail --silent --show-error --location "$tarball_url" --output "$package_file"
          actual_sha256="$(sha256sum "$package_file" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$EXPECTED_SHA256"
          sha256sum "$package_file" > "$package_file.sha256"
          echo "file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          PACKAGE_FILE: ${{ steps.download.outputs.file }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" "$PACKAGE_FILE.sha256" --clobber
